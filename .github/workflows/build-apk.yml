name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses6 libncursesw6 libtinfo6 cmake libffi-dev libssl-dev
          pip install buildozer cython
          pip install -r requirements.txt
      
      - name: Build APK
        run: |
          buildozer init
          sed -i 's/^title.*/title = Save Insta/' buildozer.spec
          sed -i 's/^package.name.*/package.name = saveinsta/' buildozer.spec
          sed -i 's/^package.domain.*/package.domain = com.youssefmansouri/' buildozer.spec
          sed -i 's/^source.include_exts.*/source.include_exts = py,png,jpg,kv,atlas,db/' buildozer.spec
          sed -i 's/^requirements.*/requirements = python3,kivy==2.2.1,requests,yt-dlp,sqlite3,urllib3,charset_normalizer,certifi,idna/' buildozer.spec
          sed -i 's/^orientation.*/orientation = portrait/' buildozer.spec
          sed -i 's/^android.permissions.*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/' buildozer.spec
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | buildozer android debug
        timeout-minutes: 60
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: save-insta-apk
          path: bin/*.apk
